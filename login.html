<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- VERY IMPORTANT FOR ANDROID WEBVIEW -->
    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 minimum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#d50000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Login</title>

    <!-- DO NOT LOAD YOUR MAIN style.css HERE -->
    <!-- This prevents index.html CSS conflicts -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    >

    <link rel="stylesheet" href="css/loginstyle.css">

    <!-- Theme detection before page renders -->
    <script>
        (function () {
            try {
                const theme = localStorage.getItem("theme");

                if (theme === "dark") {
                    document.documentElement.classList.add("dark");
                } else {
                    document.documentElement.classList.add("light");
                }
            } catch (e) {
                document.documentElement.classList.add("light");
            }
        })();
    </script>
</head>

<body class="login-page">

    <main class="login-shell">

        <form id="loginForm" class="login-card" novalidate>

            <!-- =====================================================
                 YOUR EXISTING YETI SVG
                 Paste your complete SVG here
                 ===================================================== -->

            <div class="svgContainer">
                <div>

                    <!-- YOUR EXISTING .mySVG SVG -->
                    <!-- Keep your full SVG code here -->

                    <svg
                        class="mySVG"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 200 200"
                        aria-hidden="true"
                    >

                        <circle
                            cx="100"
                            cy="100"
                            r="100"
                            fill="#a9ddf3"
                        />

                        <circle
                            cx="100"
                            cy="100"
                            r="96"
                            fill="#ffffff"
                            stroke="#3A5E77"
                            stroke-width="2.5"
                        />

                        <circle
                            class="eyeL"
                            cx="82"
                            cy="82"
                            r="5"
                            fill="#3A5E77"
                        />

                        <circle
                            class="eyeR"
                            cx="118"
                            cy="82"
                            r="5"
                            fill="#3A5E77"
                        />

                        <path
                            class="nose"
                            d="M96 91 L104 91 L100 98 Z"
                            fill="#3A5E77"
                        />

                        <path
                            class="mouth"
                            d="M88 105 Q100 114 112 105"
                            fill="none"
                            stroke="#3A5E77"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <path
                            class="hair"
                            d="M65 61
                               Q72 32 100 25
                               Q128 32 135 61
                               Q123 49 114 52
                               Q108 39 101 51
                               Q92 38 86 52
                               Q75 48 65 61Z"
                            fill="#ffffff"
                            stroke="#3A5E77"
                            stroke-width="2.5"
                        />

                        <path
                            class="body"
                            d="M42 190
                               Q46 145 72 137
                               Q100 127 128 137
                               Q154 145 158 190Z"
                            fill="#ffffff"
                            stroke="#3A5E77"
                            stroke-width="2.5"
                        />

                    </svg>

                </div>
            </div>

            <!-- EMAIL -->

            <div class="inputGroup inputGroup1">

                <label
                    for="loginEmail"
                    id="loginEmailLabel"
                >
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    inputmode="email"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    maxlength="254"
                    required
                >

                <p class="helper helper1">
                    email@domain.com
                </p>

                <small
                    id="emailError"
                    class="field-error"
                ></small>

            </div>


            <!-- PASSWORD -->

            <div class="inputGroup inputGroup2">

                <label
                    for="loginPassword"
                    id="loginPasswordLabel"
                >
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    autocomplete="current-password"
                    minlength="1"
                    required
                >

                <label
                    id="showPasswordToggle"
                    for="showPasswordCheck"
                >
                    Show

                    <input
                        id="showPasswordCheck"
                        type="checkbox"
                    >

                    <span class="indicator"></span>
                </label>

                <small
                    id="passwordError"
                    class="field-error"
                ></small>

            </div>


            <!-- LOGIN BUTTON -->

            <div class="inputGroup inputGroup3">

                <button
                    id="login"
                    type="submit"
                >
                    <span class="button-text">
                        Log in
                    </span>

                    <span
                        class="button-loader"
                        aria-hidden="true"
                    ></span>
                </button>

            </div>


            <!-- STATUS -->

            <div
                id="loginStatus"
                class="login-status"
                role="status"
                aria-live="polite"
            ></div>

        </form>

    </main>


    <!-- GSAP -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script src="https://assets.codepen.io/16327/MorphSVGPlugin3.min.js"></script>

    <script src="js/loginscript.js"></script>

</body>
</html>
