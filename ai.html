<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#d50000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>AI Assistant | DYFI Tamil Nadu</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

<style>

:root{
  --red:#d50000;
  --red2:#ef233c;
  --bg:#f5f7fa;
  --surface:#ffffff;
  --text:#111827;
  --muted:#667085;
  --border:#e5e7eb;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:
    Inter,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  min-height:100dvh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}


/* =====================================================
   APP
===================================================== */

.ai-shell{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}


/* =====================================================
   HEADER
===================================================== */

.ai-header{
  height:66px;
  min-height:66px;

  display:flex;
  align-items:center;

  padding:0 15px;
  gap:11px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #a90000,
      #d50000,
      #ef233c
    );

  box-shadow:
    0 5px 22px rgba(0,0,0,.18);

  position:relative;
  z-index:100;
}

.ai-close{
  width:42px;
  height:42px;

  border:1px solid rgba(255,255,255,.25);
  border-radius:12px;

  background:rgba(255,255,255,.12);

  color:#fff;

  display:grid;
  place-items:center;

  cursor:pointer;

  font-size:18px;
}

.ai-close:active{
  transform:scale(.93);
}

.ai-brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.ai-brand img{
  width:40px;
  height:40px;

  border-radius:50%;
  object-fit:cover;

  background:#fff;
  padding:2px;
}

.ai-brand-text{
  min-width:0;
}

.ai-brand-text strong{
  display:block;
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
}

.ai-brand-text span{
  display:block;
  font-size:11px;
  opacity:.82;
  margin-top:3px;
}

.ai-status{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:7px;

  font-size:11px;
}

.ai-status i{
  width:8px;
  height:8px;
  border-radius:50%;

  background:#65e572;

  box-shadow:
    0 0 10px #65e572;
}


/* =====================================================
   MAIN
===================================================== */

.ai-main{
  flex:1;
  min-height:0;

  display:flex;
  justify-content:center;

  overflow:hidden;
}

.ai-card{
  width:min(920px,100%);
  height:100%;

  display:flex;
  flex-direction:column;

  min-height:0;

  background:var(--surface);

  position:relative;
  overflow:hidden;
}


/* =====================================================
   INTRO
===================================================== */

.ai-intro{
  flex:0 0 auto;

  padding:17px 15px 12px;

  text-align:center;

  border-bottom:1px solid var(--border);

  background:var(--surface);

  z-index:5;
}

.ai-intro-icon{
  width:62px;
  height:62px;

  border-radius:50%;

  object-fit:cover;

  display:block;

  margin:0 auto 8px;

  background:#fff;

  box-shadow:
    0 7px 22px rgba(213,0,0,.18);
}

.ai-intro h1{
  margin:0 0 4px;

  font-size:21px;
  font-weight:800;
}

.ai-intro p{
  margin:0;

  color:var(--muted);

  font-size:12px;
}


/* =====================================================
   CHAT AREA
===================================================== */

.ai-chat-area{
  position:relative;

  flex:1;
  min-height:0;

  overflow:hidden;

  background:#fff;
}


/* =====================================================
   DIALOGFLOW MESSENGER
===================================================== */

df-messenger{

  /*
    Important:
    Messenger starts minimized.
  */

  position:fixed !important;

  right:18px !important;

  bottom:
    calc(
      18px + env(safe-area-inset-bottom)
    ) !important;

  width:auto !important;
  height:auto !important;

  z-index:99999 !important;


  --df-messenger-button-titlebar-color:#d50000;

  --df-messenger-button-titlebar-font-color:#ffffff;

  --df-messenger-chat-background-color:#ffffff;

  --df-messenger-font-color:#111827;

  --df-messenger-bot-message:#f2f4f7;

  --df-messenger-user-message:#ffe5e7;

  --df-messenger-send-icon:#d50000;

  --df-messenger-chat-window-width:100%;

  --df-messenger-chat-window-height:100%;

  --df-messenger-minimized-chat-icon-size:68px;
}


/*
  Try to make Messenger's actual launcher
  visually use bot.png.
*/

df-messenger::part(launcher){

  width:68px !important;
  height:68px !important;

  border-radius:50% !important;

  background-image:
    url("assets/bot.png") !important;

  background-size:cover !important;

  background-position:center !important;

  background-repeat:no-repeat !important;

  box-shadow:
    0 8px 25px rgba(0,0,0,.25) !important;

  overflow:hidden !important;
}


/*
  Some Dialogflow builds expose button instead.
*/

df-messenger::part(chat-icon){

  width:68px !important;
  height:68px !important;

  background-image:
    url("assets/bot.png") !important;

  background-size:cover !important;

  background-position:center !important;

  background-repeat:no-repeat !important;

  border-radius:50% !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .ai-header{
    height:60px;
    min-height:60px;
    padding:0 10px;
  }

  .ai-close{
    width:38px;
    height:38px;
  }

  .ai-brand img{
    width:36px;
    height:36px;
  }

  .ai-brand-text strong{
    font-size:13px;
  }

  .ai-brand-text span{
    font-size:10px;
  }

  .ai-status{
    display:none;
  }

  .ai-intro{
    padding:10px 12px 8px;
  }

  .ai-intro-icon{
    width:52px;
    height:52px;
    margin-bottom:6px;
  }

  .ai-intro h1{
    font-size:17px;
  }

  .ai-intro p{
    font-size:10px;
  }

  df-messenger{
    right:14px !important;

    bottom:
      calc(
        14px + env(safe-area-inset-bottom)
      ) !important;
  }

  df-messenger::part(launcher),
  df-messenger::part(chat-icon){

    width:62px !important;
    height:62px !important;

  }

}


/* =====================================================
   DARK MODE
===================================================== */

@media(prefers-color-scheme:dark){

  :root{
    --bg:#080b10;
    --surface:#11161d;
    --text:#f5f7fa;
    --muted:#aab2bf;
    --border:#29313b;
  }

  .ai-intro{
    background:var(--surface);
  }

  .ai-chat-area{
    background:var(--surface);
  }
}


/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media(max-height:500px) and (orientation:landscape){

  .ai-header{
    height:52px;
    min-height:52px;
  }

  .ai-intro{
    padding:5px 10px;
  }

  .ai-intro-icon{
    display:none;
  }

  .ai-intro h1{
    font-size:15px;
  }

  .ai-intro p{
    display:none;
  }
}

</style>

<style id="dyfi-universal-loader-style">
#loader{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#fff;color:#111;transition:opacity .35s ease,visibility .35s ease;}
#loader.loader-done{opacity:0;visibility:hidden;pointer-events:none;}
.loader-logo{text-align:center;padding:28px;}
.star-logo{width:64px;height:64px;fill:#d50000;display:block;margin:0 auto 14px;}
.dyfi-title{margin:0;font:800 28px/1.1 Poppins,Arial,sans-serif;letter-spacing:.5px;}
.dyfi-title span{display:block;font:800 11px/1.5 'Noto Sans Tamil',Arial,sans-serif;margin-top:7px;}
.dyfi-subtitle{margin:9px 0 0;font:600 10px/1.5 'Noto Sans Tamil',Arial,sans-serif;color:#777;}
html.dark #loader{background:#000;color:#f5f5f5;}
html.dark .dyfi-subtitle{color:#999;}
</style>
<script>(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){};})();</script>
</head>


<body>
<div id="loader" aria-label="Loading">
  <div class="loader-logo">
    <svg class="star-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.132 9.21l8.2-1.192z"/></svg>
    <h1 class="dyfi-title">DYFI <span>தமிழ்நாடு மாநிலக் குழு</span></h1>
    <p class="dyfi-subtitle">அனைவருக்கும் | கல்வி | அனைவருக்கும் | வேலை</p>
  </div>
</div>
<script>(function(){var done=function(){var l=document.getElementById('loader');if(l){l.classList.add('loader-done');setTimeout(function(){l.style.display='none'},350)}};window.addEventListener('load',done,{once:true});setTimeout(done,3000);})();</script>


<div class="ai-shell">


  <!-- ===================================================
       HEADER
  ==================================================== -->

  <header class="ai-header">

    <button
      id="homeBtn"
      class="ai-close"
      type="button"
      aria-label="Back to Home">

      <i class="fa-solid fa-arrow-left"></i>

    </button>


    <div class="ai-brand">

      <img
        src="assets/red.png"
        alt="DYFI Tamil Nadu"
        onerror="this.style.display='none';">


      <div class="ai-brand-text">

        <strong>
          DYFI TAMILNADU
        </strong>

        <span>
          AI Assistant
        </span>

      </div>

    </div>


    <div class="ai-status">

      <i></i>

      <span>
        Online
      </span>

    </div>

  </header>


  <!-- ===================================================
       MAIN
  ==================================================== -->

  <main class="ai-main">

    <section class="ai-card">


      <!-- INTRO -->

      <div class="ai-intro">

        <img
          class="ai-intro-icon"
          src="assets/bot.png"
          alt="AI Assistant">

        <h1>
          AI Assistant
        </h1>

        <p>
          Ask your question and chat with the
          DYFI Tamil Nadu assistant.
        </p>

      </div>


      <!-- CHAT -->

      <div
        class="ai-chat-area"
        id="chatArea">


        <!-- =================================================
             DIALOGFLOW
        ================================================== -->

        <df-messenger

          id="dfMessenger"

          intent="welcome"

          chat-title="Dyfi Assistant"

          agent-id="5b378a03-accb-407c-8e12-e15b8602d3cd"

          language-code="en"

          chat-icon="assets/bot.png">

        </df-messenger>


      </div>

    </section>

  </main>

</div>


<script>

(function(){

  "use strict";


  /* =====================================================
     HOME BUTTON
  ====================================================== */

  const homeBtn =
    document.getElementById("homeBtn");


  homeBtn.addEventListener(
    "click",
    function(){

      /*
        Return to original home page.
      */

      if(
        document.referrer &&
        document.referrer !== location.href
      ){

        history.back();

      }else{

        location.href="index.html";

      }

    }
  );


  /* =====================================================
     DIALOGFLOW
  ====================================================== */

  const messenger =
    document.getElementById("dfMessenger");


  /*
    After Messenger is loaded,
    try to open launcher normally.
  */

  if(window.customElements){

    customElements.whenDefined(
      "df-messenger"
    ).then(function(){

      setTimeout(function(){

        /*
          Force Messenger CSS variables again
          after Shadow DOM is initialized.
        */

        messenger.style.setProperty(
          "--df-messenger-minimized-chat-icon-size",
          "68px"
        );

        messenger.style.setProperty(
          "--df-messenger-button-titlebar-color",
          "#d50000"
        );

      },300);


      setTimeout(function(){

        messenger.style.setProperty(
          "--df-messenger-chat-window-width",
          "100%"
        );

      },800);

    });

  }


  /* =====================================================
     KEYBOARD SAFE
  ====================================================== */

  function keyboardFix(){

    const vv =
      window.visualViewport;

    if(!vv){
      return;
    }


    /*
      Dialogflow launcher is fixed.
      When keyboard appears, move launcher
      above keyboard.
    */

    const keyboardHeight =
      Math.max(
        0,
        window.innerHeight - vv.height
      );


    if(
      keyboardHeight > 100
    ){

      messenger.style.bottom =
        (
          keyboardHeight +
          10
        ) + "px";

    }else{

      messenger.style.bottom =
        "calc(18px + env(safe-area-inset-bottom))";

    }

  }


  if(window.visualViewport){

    window.visualViewport.addEventListener(
      "resize",
      keyboardFix,
      {passive:true}
    );

    window.visualViewport.addEventListener(
      "scroll",
      keyboardFix,
      {passive:true}
    );

  }


  window.addEventListener(
    "resize",
    keyboardFix,
    {passive:true}
  );


  window.addEventListener(
    "orientationchange",
    function(){

      setTimeout(
        keyboardFix,
        200
      );

    },
    {passive:true}
  );


  /* =====================================================
     INITIAL
  ====================================================== */

  setTimeout(
    keyboardFix,
    500
  );

  setTimeout(
    keyboardFix,
    1200
  );


})();

</script>

</body>
</html>
