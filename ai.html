<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d50000">
<meta name="mobile-web-app-capable" content="yes">
<title>AI Assistant | DYFI Tamil Nadu</title>
<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
<style>
:root{
  --red:#d50000;
  --red2:#ef233c;
  --bg:#f5f7fa;
  --surface:#fff;
  --text:#111827;
  --muted:#667085;
  --border:#e5e7eb;
  --shadow:0 18px 55px rgba(15,23,42,.14);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.ai-shell{height:100dvh;display:flex;flex-direction:column;min-height:0}
.ai-header{
  height:68px;min-height:68px;background:linear-gradient(135deg,#b80000,#e30613);
  color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;
  box-shadow:0 5px 22px rgba(0,0,0,.18);position:relative;z-index:10
}
.ai-close{
  width:42px;height:42px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);
  color:#fff;border-radius:12px;display:grid;place-items:center;font-size:20px;cursor:pointer
}
.ai-brand{display:flex;align-items:center;gap:11px;min-width:0}
.ai-brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff;padding:2px}
.ai-brand-text{min-width:0}
.ai-brand-text strong{display:block;font-size:15px;line-height:1.2}
.ai-brand-text span{display:block;font-size:11px;opacity:.82;margin-top:3px}
.ai-status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;opacity:.9}
.ai-status i{width:8px;height:8px;border-radius:50%;background:#65e572;box-shadow:0 0 10px #65e572}
.ai-main{flex:1;min-height:0;position:relative;display:flex;justify-content:center;overflow:hidden}
.ai-card{
  width:min(920px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;
  min-height:0;position:relative
}
.ai-intro{padding:22px 20px 12px;text-align:center;flex:0 0 auto}
.ai-intro h1{margin:0 0 7px;font-size:22px}
.ai-intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.ai-chat-area{position:relative;flex:1;min-height:0;overflow:hidden}
.ai-hint{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;text-align:center;color:#98a2b3;font-size:11px;pointer-events:none}
df-messenger{
  position:absolute !important;
  inset:0 !important;
  width:100% !important;
  height:100% !important;
  z-index:5 !important;
  --df-messenger-button-titlebar-color:var(--red);
  --df-messenger-button-titlebar-font-color:#fff;
  --df-messenger-chat-background-color:#fff;
  --df-messenger-font-color:#111827;
  --df-messenger-bot-message:#f2f4f7;
  --df-messenger-user-message:#ffe5e7;
  --df-messenger-send-icon:var(--red);
  --df-messenger-chat-window-width:100%;
  --df-messenger-chat-window-height:100%;
  --df-messenger-minimized-chat-icon-size:64px;
}
df-messenger::part(chat-window){height:100% !important;max-height:none !important;width:100% !important}
@media(max-width:600px){
  .ai-header{height:60px;min-height:60px;padding:0 10px}
  .ai-close{width:38px;height:38px}
  .ai-brand img{width:36px;height:36px}
  .ai-brand-text strong{font-size:13px}
  .ai-status{display:none}
  .ai-intro{padding:13px 14px 9px}
  .ai-intro h1{font-size:18px;margin-bottom:4px}
  .ai-intro p{font-size:11px}
  .ai-main{height:calc(100dvh - 60px);flex:1}
  .ai-chat-area{min-height:0}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0b0f14;--surface:#11161d;--text:#f5f7fa;--muted:#aab2bf;--border:#28313c}
  .ai-card{background:var(--surface)}
  .ai-hint{color:#7e8997}
}
</style>
</head>
<body>
<div class="ai-shell" id="aiShell">
  <header class="ai-header">
    <button class="ai-close" id="homeBtn" type="button" aria-label="Close AI Assistant">
      <i class="fas fa-arrow-left" aria-hidden="true">‹</i>
    </button>
    <div class="ai-brand">
      <img src="assets/red.png" alt="DYFI Tamil Nadu">
      <div class="ai-brand-text">
        <strong>DYFI TAMILNADU</strong>
        <span>AI Assistant</span>
      </div>
    </div>
    <div class="ai-status"><i></i><span>Online</span></div>
  </header>
  <main class="ai-main">
    <section class="ai-card" aria-label="AI Assistant">
      <div class="ai-intro">
        <h1>AI Assistant</h1>
        <p>Ask your question and chat with the DYFI Tamil Nadu assistant.</p>
      </div>
      <div class="ai-chat-area" id="chatArea">
        <df-messenger
          intent="welcome"  
     chat-title="Dyfi Assistant" 
     agent-id="5b378a03-accb-407c-8e12-e15b8602d3cd" 
     language-code="en" 
     chat-icon="assets/bot.png"
     chat-icon-size="80px">
        </df-messenger>
        <div class="ai-hint">Your messages stay inside the assistant chat.</div>
      </div>
    </section>
  </main>
</div>
<script>
(function(){
  'use strict';

  // Close always returns to the main/home page.
  document.getElementById('homeBtn').addEventListener('click', function(){
    if(history.length > 1) history.back();
    else location.href = 'index.html';
  });

  // Keyboard-safe viewport handling. The chat gets the visible viewport
  // instead of being covered when Android/iOS keyboard opens.
  const messenger = document.querySelector('df-messenger');
  const chatArea = document.getElementById('chatArea');

  function syncViewport(){
    const vv = window.visualViewport;
    if(!vv || !messenger || !chatArea) return;
    const h = Math.max(300, Math.round(vv.height - 8));
    chatArea.style.height = h + 'px';
    chatArea.style.flex = '0 0 ' + h + 'px';
    messenger.style.height = h + 'px';
    messenger.style.setProperty('--df-messenger-chat-window-height', h + 'px');
  }

  if(window.visualViewport){
    visualViewport.addEventListener('resize', syncViewport, {passive:true});
    visualViewport.addEventListener('scroll', syncViewport, {passive:true});
  }
  window.addEventListener('resize', syncViewport, {passive:true});
  window.addEventListener('orientationchange', function(){ setTimeout(syncViewport,120); }, {passive:true});

  // Wait until the custom element is upgraded before measuring.
  customElements.whenDefined('df-messenger').then(function(){
    setTimeout(syncViewport, 250);
    setTimeout(syncViewport, 900);
  }).catch(function(){});

  // Prevent pull-to-refresh while the chat page is active.
  document.addEventListener('touchmove', function(e){
    if(e.target.closest('df-messenger')) return;
  }, {passive:true});
})();
</script>
<!-- Font Awesome for header icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
</body>
</html>
