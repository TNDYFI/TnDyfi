<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#d50000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>AI Assistant | DYFI Tamil Nadu</title>

<!-- Font Awesome -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- Dialogflow Messenger -->
<script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

<style>
:root{
  --red:#d50000;
  --red-dark:#b40000;
  --red-light:#ef233c;

  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface2:#f8fafc;

  --text:#111827;
  --muted:#667085;
  --border:#e5e7eb;

  --shadow:0 15px 45px rgba(15,23,42,.14);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  min-height:100dvh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

button{
  font-family:inherit;
}

/* =========================================================
   MAIN APP
========================================================= */

.ai-shell{
  width:100%;
  height:100dvh;
  min-height:0;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* =========================================================
   HEADER
========================================================= */

.ai-header{
  height:68px;
  min-height:68px;

  display:flex;
  align-items:center;

  gap:12px;
  padding:0 16px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #a90000 0%,
      #d50000 45%,
      #ef233c 100%
    );

  box-shadow:
    0 5px 22px rgba(0,0,0,.18);

  position:relative;
  z-index:100;
}

.ai-close{
  width:42px;
  height:42px;

  border:1px solid rgba(255,255,255,.25);
  border-radius:13px;

  display:grid;
  place-items:center;

  background:rgba(255,255,255,.12);
  color:#fff;

  cursor:pointer;

  font-size:18px;

  transition:
    transform .15s ease,
    background .15s ease;
}

.ai-close:active{
  transform:scale(.92);
}

.ai-close:hover{
  background:rgba(255,255,255,.2);
}

.ai-brand{
  display:flex;
  align-items:center;
  gap:10px;

  min-width:0;
}

.ai-brand img{
  width:40px;
  height:40px;

  border-radius:50%;

  object-fit:cover;

  background:#fff;

  padding:2px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.2);
}

.ai-brand-text{
  min-width:0;
}

.ai-brand-text strong{
  display:block;

  font-size:15px;
  font-weight:800;

  line-height:1.2;

  white-space:nowrap;
}

.ai-brand-text span{
  display:block;

  margin-top:3px;

  font-size:11px;

  opacity:.82;

  white-space:nowrap;
}

.ai-status{
  margin-left:auto;

  display:flex;
  align-items:center;

  gap:7px;

  font-size:11px;

  opacity:.9;
}

.ai-status i{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#65e572;

  box-shadow:
    0 0 10px #65e572;
}

/* =========================================================
   MAIN
========================================================= */

.ai-main{
  flex:1;

  min-height:0;

  position:relative;

  display:flex;
  justify-content:center;

  overflow:hidden;
}

.ai-card{
  width:min(920px,100%);

  height:100%;

  min-height:0;

  background:var(--surface);

  display:flex;
  flex-direction:column;

  position:relative;

  overflow:hidden;

  box-shadow:var(--shadow);
}

/* =========================================================
   INTRO
========================================================= */

.ai-intro{
  flex:0 0 auto;

  padding:18px 20px 13px;

  text-align:center;

  border-bottom:1px solid var(--border);

  background:var(--surface);

  position:relative;

  z-index:2;
}

.ai-bot-icon{
  width:68px;
  height:68px;

  display:block;

  margin:0 auto 9px;

  border-radius:50%;

  object-fit:cover;

  background:#fff;

  border:3px solid rgba(213,0,0,.08);

  box-shadow:
    0 8px 25px rgba(213,0,0,.18);
}

.ai-bot-fallback{
  display:none;

  width:68px;
  height:68px;

  margin:0 auto 9px;

  border-radius:50%;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #d50000,
      #ef233c
    );

  color:#fff;

  font-size:28px;

  box-shadow:
    0 8px 25px rgba(213,0,0,.22);
}

.ai-intro h1{
  margin:0 0 5px;

  font-size:21px;

  font-weight:800;
}

.ai-intro p{
  margin:0;

  color:var(--muted);

  font-size:12px;

  line-height:1.5;
}

/* =========================================================
   CHAT AREA
========================================================= */

.ai-chat-area{
  position:relative;

  flex:1;

  min-height:0;

  overflow:hidden;

  background:var(--surface);
}

/*
   Dialogflow Messenger
*/

df-messenger{
  position:absolute !important;

  left:0 !important;
  right:0 !important;
  top:0 !important;
  bottom:0 !important;

  width:100% !important;
  height:100% !important;

  max-width:none !important;

  z-index:10 !important;

  --df-messenger-button-titlebar-color:#d50000;
  --df-messenger-button-titlebar-font-color:#ffffff;

  --df-messenger-chat-background-color:#ffffff;

  --df-messenger-font-color:#111827;

  --df-messenger-bot-message:#f2f4f7;
  --df-messenger-user-message:#ffe5e7;

  --df-messenger-send-icon:#d50000;

  --df-messenger-chat-window-width:100%;
  --df-messenger-chat-window-height:100%;

  --df-messenger-minimized-chat-icon-size:64px;
}

/* Shadow DOM part if browser supports it */

df-messenger::part(chat-window){
  width:100% !important;
  height:100% !important;

  max-width:none !important;
  max-height:none !important;
}

/* =========================================================
   SMALL HINT
========================================================= */

.ai-hint{
  position:absolute;

  left:15px;
  right:15px;
  bottom:8px;

  z-index:3;

  text-align:center;

  color:#98a2b3;

  font-size:10px;

  pointer-events:none;

  opacity:.65;
}

/* =========================================================
   LOADING
========================================================= */

.ai-loading{
  position:absolute;

  inset:0;

  z-index:50;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--surface);

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.ai-loading.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.ai-loading-inner{
  text-align:center;
}

.ai-loading-icon{
  width:58px;
  height:58px;

  border-radius:50%;

  object-fit:cover;

  animation:
    aiPulse 1.2s ease-in-out infinite;
}

.ai-loading-text{
  margin-top:10px;

  color:var(--muted);

  font-size:12px;
}

@keyframes aiPulse{
  0%,100%{
    transform:scale(1);
    opacity:.75;
  }

  50%{
    transform:scale(1.08);
    opacity:1;
  }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .ai-header{
    height:60px;
    min-height:60px;

    padding:
      0
      10px
      0
      10px;
  }

  .ai-close{
    width:38px;
    height:38px;

    border-radius:11px;
  }

  .ai-brand{
    gap:8px;
  }

  .ai-brand img{
    width:36px;
    height:36px;
  }

  .ai-brand-text strong{
    font-size:13px;
  }

  .ai-brand-text span{
    font-size:10px;
  }

  .ai-status{
    display:none;
  }

  .ai-intro{
    padding:
      11px
      12px
      8px;
  }

  .ai-bot-icon,
  .ai-bot-fallback{
    width:54px;
    height:54px;

    margin-bottom:6px;
  }

  .ai-bot-fallback{
    font-size:22px;
  }

  .ai-intro h1{
    font-size:17px;
    margin-bottom:3px;
  }

  .ai-intro p{
    font-size:10.5px;
  }

  .ai-main{
    height:calc(100dvh - 60px);
  }

  .ai-chat-area{
    min-height:0;
  }
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

  .ai-brand-text span{
    display:none;
  }

  .ai-intro{
    padding-top:8px;
    padding-bottom:6px;
  }

  .ai-bot-icon,
  .ai-bot-fallback{
    width:46px;
    height:46px;
  }

  .ai-intro h1{
    font-size:16px;
  }
}

/* =========================================================
   DARK MODE
========================================================= */

@media(prefers-color-scheme:dark){

  :root{
    --bg:#080b10;
    --surface:#11161d;
    --surface2:#161c24;

    --text:#f5f7fa;
    --muted:#aab2bf;

    --border:#29313b;
  }

  .ai-card{
    background:var(--surface);
  }

  .ai-intro{
    background:var(--surface);
    border-color:var(--border);
  }

  .ai-chat-area{
    background:var(--surface);
  }

  .ai-hint{
    color:#7e8997;
  }
}

/* =========================================================
   LANDSCAPE
========================================================= */

@media(max-height:500px) and (orientation:landscape){

  .ai-header{
    height:52px;
    min-height:52px;
  }

  .ai-brand img{
    width:32px;
    height:32px;
  }

  .ai-close{
    width:34px;
    height:34px;
  }

  .ai-intro{
    padding:5px 10px;
  }

  .ai-bot-icon,
  .ai-bot-fallback{
    display:none !important;
  }

  .ai-intro h1{
    font-size:15px;
  }

  .ai-intro p{
    display:none;
  }

  .ai-main{
    height:calc(100dvh - 52px);
  }
}
</style>
</head>

<body>

<div class="ai-shell" id="aiShell">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="ai-header">

    <button
      class="ai-close"
      id="homeBtn"
      type="button"
      aria-label="Back to Home">

      <i class="fa-solid fa-arrow-left"></i>

    </button>

    <div class="ai-brand">

      <img
        src="assets/red.png"
        alt="DYFI Tamil Nadu"
        onerror="this.style.display='none';">

      <div class="ai-brand-text">

        <strong>DYFI TAMILNADU</strong>

        <span>AI Assistant</span>

      </div>

    </div>

    <div class="ai-status">

      <i></i>

      <span>Online</span>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="ai-main">

    <section
      class="ai-card"
      aria-label="DYFI Tamil Nadu AI Assistant">


      <!-- INTRO -->

      <div class="ai-intro">

        <img
          class="ai-bot-icon"
          id="botIcon"
          src="assets/bot.png"
          alt="AI Assistant">

        <div
          class="ai-bot-fallback"
          id="botFallback">

          <i class="fa-solid fa-robot"></i>

        </div>

        <h1>AI Assistant</h1>

        <p>
          Ask your question and chat with the
          DYFI Tamil Nadu assistant.
        </p>

      </div>


      <!-- CHAT -->

      <div
        class="ai-chat-area"
        id="chatArea">


        <!-- Loading -->

        <div
          class="ai-loading"
          id="aiLoading">

          <div class="ai-loading-inner">

            <img
              class="ai-loading-icon"
              src="assets/bot.png"
              alt=""
              onerror="this.style.display='none';">

            <div class="ai-loading-text">
              Connecting to AI Assistant...
            </div>

          </div>

        </div>


        <!-- Dialogflow -->

        <df-messenger
          id="dfMessenger"

          intent="welcome"

          chat-title="Dyfi Assistant"

          agent-id="5b378a03-accb-407c-8e12-e15b8602d3cd"

          language-code="en">

        </df-messenger>


        <div class="ai-hint">
          Your messages stay inside the assistant chat.
        </div>

      </div>

    </section>

  </main>

</div>


<script>
(function(){

  "use strict";


  /* =====================================================
     ELEMENTS
  ====================================================== */

  const homeBtn =
    document.getElementById("homeBtn");

  const chatArea =
    document.getElementById("chatArea");

  const messenger =
    document.getElementById("dfMessenger");

  const botIcon =
    document.getElementById("botIcon");

  const botFallback =
    document.getElementById("botFallback");

  const loading =
    document.getElementById("aiLoading");


  /* =====================================================
     BOT IMAGE FALLBACK
  ====================================================== */

  if(botIcon){

    botIcon.addEventListener("error",function(){

      botIcon.style.display = "none";

      if(botFallback){
        botFallback.style.display = "flex";
      }

    });

  }


  /* =====================================================
     HOME / BACK
  ====================================================== */

  homeBtn.addEventListener("click",function(){

    /*
      Always go back to main website.
    */

    if(document.referrer &&
       document.referrer !== window.location.href){

      history.back();

    }else{

      window.location.href = "index.html";

    }

  });


  /* =====================================================
     KEYBOARD SAFE VIEWPORT
  ====================================================== */

  let rafId = null;

  function syncViewport(){

    if(rafId){
      cancelAnimationFrame(rafId);
    }

    rafId = requestAnimationFrame(function(){

      const vv =
        window.visualViewport;

      if(!chatArea || !messenger){
        return;
      }


      /*
        When Android keyboard opens,
        visualViewport becomes smaller.
      */

      if(vv){

        const visibleHeight =
          Math.max(
            260,
            Math.round(vv.height)
          );

        const rect =
          chatArea.getBoundingClientRect();

        /*
          Don't blindly use full screen height.
          Keep messenger inside visible area.
        */

        const available =
          Math.max(
            260,
            Math.min(
              visibleHeight - rect.top,
              window.innerHeight - rect.top
            )
          );

        chatArea.style.height =
          available + "px";

        chatArea.style.flex =
          "0 0 " + available + "px";

        messenger.style.height =
          available + "px";

        messenger.style.setProperty(
          "--df-messenger-chat-window-height",
          available + "px"
        );

      }else{

        const h =
          chatArea.clientHeight;

        messenger.style.height =
          h + "px";

      }

    });

  }


  /* =====================================================
     VIEWPORT EVENTS
  ====================================================== */

  if(window.visualViewport){

    window.visualViewport.addEventListener(
      "resize",
      syncViewport,
      {passive:true}
    );

    window.visualViewport.addEventListener(
      "scroll",
      syncViewport,
      {passive:true}
    );

  }

  window.addEventListener(
    "resize",
    syncViewport,
    {passive:true}
  );


  window.addEventListener(
    "orientationchange",
    function(){

      setTimeout(syncViewport,100);
      setTimeout(syncViewport,400);

    },
    {passive:true}
  );


  /* =====================================================
     DIALOGFLOW READY
  ====================================================== */

  function hideLoader(){

    if(loading){
      loading.classList.add("hide");
    }

    syncViewport();

  }


  /*
    Wait for Dialogflow custom element.
  */

  if(window.customElements){

    customElements.whenDefined(
      "df-messenger"
    ).then(function(){

      setTimeout(
        hideLoader,
        400
      );

      setTimeout(
        syncViewport,
        800
      );

      setTimeout(
        syncViewport,
        1500
      );

    }).catch(function(){

      setTimeout(
        hideLoader,
        1000
      );

    });

  }else{

    setTimeout(
      hideLoader,
      1000
    );

  }


  /* =====================================================
     INITIAL SYNC
  ====================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function(){

      setTimeout(
        syncViewport,
        100
      );

      setTimeout(
        syncViewport,
        500
      );

    }
  );


  window.addEventListener(
    "load",
    function(){

      setTimeout(
        syncViewport,
        200
      );

      setTimeout(
        syncViewport,
        1000
      );

    }
  );


  /* =====================================================
     ANDROID KEYBOARD
  ====================================================== */

  document.addEventListener(
    "focusin",
    function(e){

      if(
        e.target &&
        (
          e.target.tagName === "INPUT" ||
          e.target.tagName === "TEXTAREA"
        )
      ){

        setTimeout(
          syncViewport,
          100
        );

        setTimeout(
          syncViewport,
          350
        );

        setTimeout(
          syncViewport,
          700
        );

      }

    },
    true
  );


  document.addEventListener(
    "focusout",
    function(){

      setTimeout(
        syncViewport,
        200
      );

    },
    true
  );


  /* =====================================================
     PREVENT BODY SCROLL
  ====================================================== */

  document.addEventListener(
    "touchmove",
    function(e){

      /*
        Let Dialogflow handle its own scrolling.
      */

      if(
        e.target &&
        e.target.closest &&
        e.target.closest("df-messenger")
      ){
        return;
      }

    },
    {passive:true}
  );


})();
</script>

</body>
</html>
